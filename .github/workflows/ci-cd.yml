name: MWS Website CI/CD

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  frontend-tests:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

  backend-tests:
    name: Backend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate

      - name: Validate Prisma schema
        run: bun run db:validate

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [frontend-tests, backend-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose file
        run: docker compose config

      - name: Build Compose services
        run: docker compose build client server

  publish-images:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    strategy:
      matrix:
        include:
          - image: client
            context: ./client
            dockerfile: ./client/Dockerfile
          - image: server
            context: ./server
            dockerfile: ./server/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: publish-images
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Trigger Komodo staging webhook
        env:
          KOMODO_STAGING_WEBHOOK_URL: ${{ secrets.KOMODO_STAGING_WEBHOOK_URL }}
          KOMODO_STAGING_WEBHOOK_SECRET: ${{ secrets.KOMODO_STAGING_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "$KOMODO_STAGING_WEBHOOK_URL" ] || [ -z "$KOMODO_STAGING_WEBHOOK_SECRET" ]; then
            echo "Komodo staging webhook secrets are not configured."
            exit 1
          fi

          payload="$(jq -n \
            --arg ref "$GITHUB_REF" \
            --arg before "${{ github.event.before }}" \
            --arg after "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg branch "${GITHUB_REF_NAME}" \
            --arg pusher "${GITHUB_ACTOR}" \
            --arg compare "${{ github.event.compare }}" \
            '{
              ref: $ref,
              before: $before,
              after: $after,
              repository: {
                full_name: $repository,
                name: ($repository | split("/")[-1]),
                default_branch: $branch
              },
              pusher: { name: $pusher },
              sender: { login: $pusher },
              compare: $compare,
              head_commit: {
                id: $after,
                message: "Deploy staging from GitHub Actions"
              }
            }')"

          signature="sha256=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$KOMODO_STAGING_WEBHOOK_SECRET" -binary | xxd -p -c 256)"

          curl --fail --show-error --silent \
            -X POST "$KOMODO_STAGING_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -H "X-GitHub-Delivery: ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -H "X-Hub-Signature-256: $signature" \
            --data "$payload"
