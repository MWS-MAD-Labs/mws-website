services:
  db:
    image: postgres:16-alpine
    container_name: mws-website-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mws_website
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mws_website
    ports:
      - "55432:5432"
    volumes:
      - mws_website_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-shadow-db.sql:/docker-entrypoint-initdb.d/10-init-shadow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mws_website -d mws_website"]
      interval: 5s
      timeout: 5s
      retries: 10


  minio:
    image: minio/minio:latest
    container_name: mws-website-minio
    restart: unless-stopped
    ports:
      - "9100:9000"
      - "9009:9009"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9009"

volumes:
  mws_website_pgdata:
  minio_data:
