services:
  db:
    image: postgres:16-alpine
    container_name: mws-website-db
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mws_website}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mws_website}
    expose:
      - "5432"
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - mws_website_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-shadow-db.sql:/docker-entrypoint-initdb.d/10-init-shadow-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  minio:
    # MinIO Community storage. The old mws-website_minio_data volume is kept as backup.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: mws-website-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - path: ./.env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    expose:
      - "9000"
      - "9001"
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9020}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9021}:9001"
    volumes:
      - minio_clean:/data
    networks:
      - internal

  server:
    container_name: mws-website-be
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4004
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:${CLIENT_HTTP_PORT:-7001}}
      JWT_SECRET: ${JWT_SECRET:-replace-this-local-dev-secret}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-mws_cms_session}
      ALLOWED_DOMAIN: ${ALLOWED_DOMAIN:-millennia21.id}
      CENTRAL_API_BASE_URL: ${CENTRAL_API_BASE_URL:-}
      CENTRAL_API_TOKEN: ${CENTRAL_API_TOKEN:-}
      CMS_BOOTSTRAP_SUPER_ADMIN_EMAILS: ${CMS_BOOTSTRAP_SUPER_ADMIN_EMAILS:-}
      CMS_BOOTSTRAP_SUPER_ADMIN_CENTRAL_IDS: ${CMS_BOOTSTRAP_SUPER_ADMIN_CENTRAL_IDS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:${CLIENT_HTTP_PORT:-7001}/auth/google/callback}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-mws-gallery}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
    command: >
      sh -c "export DATABASE_URL=\"postgresql://$${POSTGRES_USER:-mws_website}:$${POSTGRES_PASSWORD:-postgres}@db:5432/$${POSTGRES_DB:-mws_website}?schema=public\" &&
      export SHADOW_DATABASE_URL=\"postgresql://$${POSTGRES_USER:-mws_website}:$${POSTGRES_PASSWORD:-postgres}@db:5432/$${POSTGRES_DB:-mws_website}_shadow?schema=public\" &&
      bun run db:migrate &&
      bun run src/index.ts"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    expose:
      - "4004"
    ports:
      - "127.0.0.1:${SERVER_HOST_PORT:-4004}:4004"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bun -e 'const r = await fetch("http://127.0.0.1:4004/health"); process.exit(r.ok ? 0 : 1)'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      internal:
        aliases:
          - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  client:
    container_name: mws-website-fe
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-${GOOGLE_CLIENT_ID:-}}
      VITE_GOOGLE_REDIRECT_URI: ${VITE_GOOGLE_REDIRECT_URI:-}
    expose:
      - "80"
    ports:
      - "${CLIENT_HTTP_PORT:-7001}:80"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- --header="Host: localhost" http://127.0.0.1/health >/dev/null
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      internal:
      mws-unified:
        aliases:
          - mws-website-fe
          - mws-website-client
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  internal:
    driver: bridge
  mws-unified:
    external: true
    name: mws-unified

volumes:
  mws_website_pgdata:
  # Backup lama tetap tidak disentuh: mws-website_minio_data
  minio_clean:
    name: mws-website_minio_clean
