map $http_accept $mws_website_spa_request {
  default 0;
  "~*text/html" 1;
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=30s ipv6=off;
  client_max_body_size 100m;
  error_page 418 = @spa;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location @spa {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    set $website_api backend:4004;
    proxy_pass http://$website_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    set $website_api backend:4004;
    proxy_pass http://$website_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /admin is both the React CMS route and the backend CMS API prefix. Browser
  # navigations ask for HTML and stay in the SPA; fetches ask for JSON and are
  # sent to the backend.
  location ^~ /admin {
    if ($mws_website_spa_request) {
      return 418;
    }

    set $website_api backend:4004;
    proxy_pass http://$website_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Runtime config, written by docker-entrypoint.d on every container start.
  # Never cached: it is how one image is pointed at different environments.
  location = /env.js {
    add_header Cache-Control "no-store";
    try_files /env.js =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
