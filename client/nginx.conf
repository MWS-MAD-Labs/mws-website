map $http_accept $mws_website_spa_request {
  default 0;
  "~*text/html" 1;
}

# HTML pages must be revalidated. An empty value means nginx adds no header.
map $http_accept $mws_website_html_cache_control {
  default "";
  "~*text/html" "no-cache";
}

server {
  listen 80 default_server;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=30s ipv6=off;
  # Room above the 50 MB video limit for multipart overhead.
  client_max_body_size 60m;
  error_page 418 = @spa;

  # Text compresses to about a third (the public JS bundle: 689 KB -> 217 KB).
  # Images and video are already compressed, so they are left alone.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json
             application/xml application/manifest+json image/svg+xml;

  # /admin/... answers HTML (SPA) or JSON (API) depending on Accept. Without
  # Vary the browser can reuse a cached HTML page for an API call to the same
  # URL, and the CMS then crashes reading fields of an HTML string.
  add_header Vary "Accept" always;
  add_header Cache-Control $mws_website_html_cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https:; connect-src 'self' blob: https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cloudflareinsights.com; frame-src https://www.google.com/recaptcha/ https://www.google.com/maps/ https://www.youtube.com/; form-action 'self'; upgrade-insecure-requests" always;

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location @spa {
    try_files $uri $uri/ /index.html;
  }

  # Vite puts a content hash in every file name here, so a file never changes
  # and browsers may keep it for a year. A missing chunk must 404: falling back
  # to index.html would hand the browser HTML where it expects JavaScript.
  location /assets/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Bundled site photos keep their names across releases: cache for a week,
  # then revalidate (ETag) so a replaced photo still shows up.
  location /assets-mws/ {
    try_files $uri =404;
    access_log off;
    add_header Cache-Control "public, max-age=604800" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Uploaded files (gallery, news, academic). The backend checks the request
  # and answers with `X-Accel-Redirect: /_minio/<bucket>/<key>?<signature>`;
  # nginx then fetches the object from MinIO and sends it. This keeps file
  # bytes out of the Bun backend, whose memory grew with every slow download.
  # MinIO answers Range, If-None-Match and Content-Length itself.
  location /_minio/ {
    internal;
    set $mws_minio minio:9000;
    rewrite ^/_minio/(.*)$ /$1 break;
    proxy_pass http://$mws_minio;
    # The signature covers the method. A visitor's HEAD is fetched as GET and
    # nginx drops the body, or MinIO would refuse it.
    proxy_method GET;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # The URL is signed for this Host. Nothing of the visitor's own request
    # (session cookie, auth) is sent to storage.
    proxy_set_header Host minio:9000;
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_hide_header Set-Cookie;
    # Cache-Control comes from the backend's response (nginx keeps it across
    # the redirect); the copy stored with the object at upload is ignored.
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Xss-Protection;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header x-amz-request-id;
    proxy_hide_header x-amz-id-2;
    proxy_hide_header X-Amz-Bucket-Region;
    proxy_hide_header Server;
    proxy_intercept_errors on;
    error_page 403 404 = @minio_missing;
  }

  location @minio_missing {
    default_type application/json;
    return 404 '{"errors":"File not found."}';
  }

  location /api/ {
    set $website_api backend:4004;
    proxy_pass http://$website_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /auth/ {
    set $website_api backend:4004;
    proxy_pass http://$website_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # /admin is both the React CMS route and the backend CMS API prefix. Browser
  # navigations ask for HTML and stay in the SPA; fetches ask for JSON and are
  # sent to the backend.
  location ^~ /admin {
    if ($mws_website_spa_request) {
      return 418;
    }

    set $website_api backend:4004;
    proxy_pass http://$website_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Runtime config, written by docker-entrypoint.d on every container start.
  # Never cached: it is how one image is pointed at different environments.
  location = /env.js {
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self' 'unsafe-inline' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob: https:; connect-src 'self' blob: https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://cloudflareinsights.com; frame-src https://www.google.com/recaptcha/ https://www.google.com/maps/ https://www.youtube.com/; form-action 'self'; upgrade-insecure-requests" always;
    try_files /env.js =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
